# XcodeGen spec — generate the Xcode project with:  brew install xcodegen && xcodegen generate
# (CI does this on every push; the .xcodeproj and Info.plist are generated, not committed.)
# Build with Xcode 26 (iOS 26 SDK, required by App Store Connect); deployment target stays iOS 18.
name: FridgeMuseum

options:
  bundleIdPrefix: tw.starlight
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: zh-Hant
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Xcode 26 new-project defaults are MainActor isolation + approachable concurrency. This code is written for
    # the classic Swift 6 rules (explicit @MainActor), so pin them; older Xcode ignores these keys.
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    SWIFT_APPROACHABLE_CONCURRENCY: NO
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Overridden by CI (APPLE_TEAM_ID). Leave empty for simulator builds.
    DEVELOPMENT_TEAM: ""
    # Overridden by CI (repository variable APP_BUNDLE_ID).
    APP_BUNDLE_ID: tw.starlight.fridgemuseum
    # 版權字串（待擁有者確認）— the only place it is defined.
    APP_COPYRIGHT: "© 星光工作室 Starlight Studio"

targets:
  FridgeMuseum:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: FridgeMuseum
        excludes:
          - "Info.plist"
          - "Resources/PrivacyInfo.xcprivacy"
          - "StoreKit/FridgeMuseum.storekit"
          - "**/API.md"
      - path: FridgeMuseum/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: FridgeMuseum/Info.plist
      properties:
        # Localized in FridgeMuseum/Resources/InfoPlist.xcstrings (zh-Hant 冰箱美術館 / en My Fridge Museum).
        CFBundleDisplayName: 冰箱美術館
        CFBundleDevelopmentRegion: zh-Hant
        CFBundleLocalizations:
          - zh-Hant
          - en
        UIAppFonts:
          - Huninn-Regular.ttf
          - ChironGoRoundTC-Regular.ttf
          - ChironGoRoundTC-Bold.ttf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.photography
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: $(APP_COPYRIGHT)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: 用相機拍下孩子的畫作和勞作。照片只會存在這支手機裡。
        NSPhotoLibraryAddUsageDescription: 把整理好的作品存到「照片」。
        NSPhotoLibraryUsageDescription: 為每位小朋友建立「冰箱美術館」相簿，並把整理好的作品放進去。
        NSMicrophoneUsageDescription: 錄下孩子介紹自己作品的聲音，錄音只會存在這支手機裡。
        NSSpeechRecognitionUsageDescription: 在手機上把孩子的錄音轉成文字備註，不會上傳到網路。
    settings:
      base:
        PRODUCT_NAME: FridgeMuseum
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        # String Catalogs: Localizable.xcstrings + InfoPlist.xcstrings (zh-Hant source, en).
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        # Core Image kernels written in Metal (ProcessingKit/Kernels.metal).
        MTL_COMPILER_FLAGS: -fcikernel
        MTLLINKER_FLAGS: -cikernel
        # Add FM_SWIFT_VISION to try the new Swift Vision API path for document detection (unverified):
        # SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FM_SWIFT_VISION"

  FridgeMuseumTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: FridgeMuseumTests
    dependencies:
      - target: FridgeMuseum
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        CODE_SIGN_STYLE: Automatic

  # Screenshot tests (scheme FridgeMuseumShots, workflow .github/workflows/ios-shots.yml): renders key screens in
  # zh/en × light/dark and writes PNGs that CI pushes to the `ci-shots` branch.
  FridgeMuseumUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: FridgeMuseumUITests
    dependencies:
      - target: FridgeMuseum
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).uitests
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: FridgeMuseum

schemes:
  FridgeMuseumShots:
    build:
      targets:
        FridgeMuseum: all
        FridgeMuseumUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: FridgeMuseum/StoreKit/FridgeMuseum.storekit
    test:
      config: Debug
      targets:
        - FridgeMuseumUITests
  FridgeMuseum:
    build:
      targets:
        FridgeMuseum: all
        FridgeMuseumTests: [test]
    run:
      config: Debug
      # Local StoreKit testing (StoreKit/API.md). The .storekit file is excluded from the app bundle above.
      storeKitConfiguration: FridgeMuseum/StoreKit/FridgeMuseum.storekit
    test:
      config: Debug
      targets:
        - FridgeMuseumTests
    archive:
      config: Release
